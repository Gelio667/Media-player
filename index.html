<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Музыкальный Плеер</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-card: #1f2833;
            --accent: #45f3ff;
            --text-main: #ffffff;
            --text-muted: #c5a059;
            --gray: #66fcf1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; overflow: hidden; }
        header { text-align: center; margin-bottom: 15px; }
        header h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); text-shadow: 0 0 10px rgba(69, 243, 255, 0.3); }
        header p { font-size: 0.8rem; color: #888; margin-top: 4px; }
        .current-track-card { background: linear-gradient(145deg, #151a22, #1f2833); border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.5); border: 1px solid rgba(69, 243, 255, 0.1); margin-bottom: 15px; }
        .track-cover-art { width: 140px; height: 140px; border-radius: 15px; margin: 0 auto 15px; background: #222; box-shadow: 0 4px 15px rgba(0,0,0,0.4); object-fit: cover; border: 2px solid var(--accent); transition: transform 0.3s ease; }
        .playing .track-cover-art { transform: scale(1.03); box-shadow: 0 0 20px rgba(69, 243, 255, 0.4); }
        .track-info-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info-artist { font-size: 0.9rem; color: #aaa; margin-bottom: 15px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; }
        .btn { background: none; border: none; color: var(--text-main); cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
        .btn:active { transform: scale(0.9); }
        .btn-secondary { color: #888; font-size: 1.5rem; }
        .btn-secondary:hover { color: var(--accent); }
        .btn-main { background: var(--accent); color: var(--bg-main); width: 55px; height: 55px; border-radius: 50%; font-size: 1.3rem; box-shadow: 0 0 15px rgba(69, 243, 255, 0.4); }
        .progress-container { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: #888; gap: 10px; }
        .progress-bar-wrapper { width: 100%; height: 5px; background: #333; border-radius: 5px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; border-radius: 5px; box-shadow: 0 0 8px var(--accent); }
        .playlist-section { flex-grow: 1; overflow-y: auto; background: rgba(31, 40, 51, 0.3); border-radius: 20px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .playlist-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin: 5px 0 10px 5px; }
        .track-row { display: flex; align-items: center; padding: 8px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; transition: background 0.2s; }
        .track-row:hover, .track-row.active { background: rgba(69, 243, 255, 0.1); }
        .row-cover { width: 40px; height: 40px; border-radius: 8px; margin-right: 12px; object-fit: cover; }
        .row-details { flex-grow: 1; min-width: 0; }
        .row-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row-artist { font-size: 0.75rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-section::-webkit-scrollbar { width: 4px; }
        .playlist-section::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>NEON WAVE PLAYER</h1>
        <p id="cache-status">Загрузка космических треков...</p>
    </header>

    <div class="current-track-card" id="player-container">
        <img id="current-cover" class="track-cover-art" src="https://placeholder.com" alt="Cover">
        <div class="track-info-title" id="current-title">Название песни</div>
        <div class="track-info-artist" id="current-artist">Исполнитель</div>
        
        <div class="controls">
            <button class="btn btn-secondary" onclick="prevTrack()">⏮</button>
            <button class="btn btn-main" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="btn btn-secondary" onclick="nextTrack()">⏭</button>
        </div>

        <div class="progress-container">
            <span id="time-current">0:00</span>
            <div class="progress-bar-wrapper" id="progress-wrapper" onclick="seek(event)">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span id="time-total">0:00</span>
        </div>
    </div>

    <div class="playlist-section">
        <div class="playlist-title">Плейлист из 10 случайных треков</div>
        <div id="tracks-list-container"></div>
    </div>

    <audio id="audio-element"></audio>

<script>
    const JAMENDO_CLIENT_ID = "1df6f4f6"; 

    const tg = window.Telegram.WebApp;
    tg.expand();

    const audio = document.getElementById('audio-element');
    const playBtn = document.getElementById('play-btn');
    const progressFill = document.getElementById('progress-fill');
    const progressWrapper = document.getElementById('progress-wrapper');
    const cacheStatus = document.getElementById('cache-status');

    let playlist = [];
    let currentIndex = 0;

    async function initPlayer() {
        const cachedData = localStorage.getItem('cached_tracks');
        const cacheTime = localStorage.getItem('cache_time');
        const now = new Date().getTime();

        if (cachedData && cacheTime && (now - cacheTime < 24 * 60 * 60 * 1000)) {
            playlist = JSON.parse(cachedData);
            cacheStatus.innerText = "⚡ Треки загружены из локального кэша";
            renderPlaylist();
            loadTrack(0, false);
        } else {
            cacheStatus.innerText = "🌐 Обновление треков через API...";
            try {
                const randomOffset = Math.floor(Math.random() * 100);
                const url = `https://jamendo.com{JAMENDO_CLIENT_ID}&format=json&limit=10&offset=${randomOffset}&order=popularity_month&imagesize=200`;
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.results && data.results.length > 0) {
                    playlist = data.results.map(track => ({
                        id: track.id,
                        title: track.name,
                        artist: track.artist_name,
                        cover: track.image,
                        audioUrl: track.audio
                    }));
                    localStorage.setItem('cached_tracks', JSON.stringify(playlist));
                    localStorage.setItem('cache_time', now.toString());
                    cacheStatus.innerText = "✅ Новые 10 треков успешно кэшированы";
                } else {
                    cacheStatus.innerText = "❌ Ошибка API: не удалось получить данные";
                }
            } catch (error) {
                cacheStatus.innerText = "❌ Ошибка сети при обновлении";
                if(cachedData) {
                    playlist = JSON.parse(cachedData);
                    cacheStatus.innerText = "⚠️ Сеть недоступна. Загружен старый кэш.";
                }
            }
            renderPlaylist();
            if(playlist.length > 0) loadTrack(0, false);
        }
    }

    function renderPlaylist() {
        const container = document.getElementById('tracks-list-container');
        container.innerHTML = '';
        playlist.forEach((track, index) => {
            const row = document.createElement('div');
            row.className = `track-row ${index === currentIndex ? 'active' : ''}`;
            row.id = `track-${index}`;
            row.onclick = () => loadTrack(index, true);
            row.innerHTML = `
                <img class="row-cover" src="${track.cover || 'https://placeholder.com'}" alt="cover">
                <div class="row-details">
                    <div class="row-title">${track.title}</div>
                    <div class="row-artist">${track.artist}</div>
                </div>
            `;
            container.appendChild(row);
        });
    }

    function loadTrack(index, shouldPlay = true) {
        if(playlist.length === 0) return;
        
        const oldRow = document.getElementById(`track-${currentIndex}`);
        if(oldRow) oldRow.classList.remove('active');

        currentIndex = index;
        
        const newRow = document.getElementById(`track-${currentIndex}`);
        if(newRow) {
            newRow.classList.add('active');
            newRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        const track = playlist[currentIndex];
        document.getElementById('current-title').innerText = track.title;
        document.getElementById('current-artist').innerText = track.artist;
        document.getElementById('current-cover').src = track.cover;
        audio.src = track.audioUrl;

        if (shouldPlay) {
            audio.play();
            playBtn.innerText = "⏸";
            document.getElementById('player-container').classList.add('playing');
        } else {
            playBtn.innerText = "▶";
            document.getElementById('player-container').classList.remove('playing');
        }
    }

    function togglePlay() {
        if(audio.paused) {
            audio.play();
            playBtn.innerText = "⏸";
            document.getElementById('player-container').classList.add('playing');
        } else {
            audio.pause();
            playBtn.innerText = "▶";
            document.getElementById('player-container').classList.remove('playing');
        }
    }
function nextTrack() {
    let nextIndex = currentIndex + 1;
    if (nextIndex >= playlist.length) nextIndex = 0;
    loadTrack(nextIndex, true);
}
function prevTrack() {
    let prevIndex = currentIndex - 1;
    if (prevIndex < 0) prevIndex = playlist.length - 1;
    loadTrack(prevIndex, true);
}
audio.addEventListener('timeupdate', () => {
    if(audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = ${progressPercent}%;
        document.getElementById('time-current').innerText = formatTime(audio.currentTime);
        document.getElementById('time-total').innerText = formatTime(audio.duration);
    }
});
audio.addEventListener('ended', () => {
    nextTrack();
});
function seek(event) {
    const width = progressWrapper.clientWidth;
    const clickX = event.offsetX;
    const duration = audio.duration;
    if(duration) {
        audio.currentTime = (clickX / width) * duration;
    }
}
function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return ${min}:${sec < 10 ? '0' : ''}${sec};
}
window.onload = initPlayer;
